[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kni-audit-sdk"
version = "1.0.0"
description = "Shared audit/consent event package for KANDI products"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "redis>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "fakeredis>=2",
]

[tool.setuptools]
packages = ["kni_audit_sdk"]
